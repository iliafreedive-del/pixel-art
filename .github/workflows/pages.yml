# Каждый пуш в main копируется в ветку gh-pages — тестовая страница обновляется сама.
name: Тестовая страница
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Обновить gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git push --force origin HEAD:gh-pages
